nodeLinker: node-modules

# Never run dependencies' install scripts. The release jobs install with
# id-token: write (and the CLI signing secrets nearby), so a compromised
# dependency's postinstall could otherwise publish or sign through our own
# pipeline. The one native module we need, @pokusew/pcsclite, is compiled
# explicitly with `yarn build:native` (see package.json); the others that list
# build scripts (bufferutil, utf-8-validate, esbuild, es5-ext) work without them.
enableScripts: false

# Refuse npm versions published less than 3 days ago; most malicious releases
# are pulled within that window. Applies when a version is resolved (yarn add,
# yarn up); versions already in yarn.lock are unaffected. Same as burner-app.
npmMinimalAgeGate: 3d

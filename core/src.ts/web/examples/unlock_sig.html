<!DOCTYPE html>
<html>
<head>
    <!--

    <title>LibHaLo Demo</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <script type="text/javascript">
        // ensure the library is always fully reloaded
        document.write('<script src="../dist/libhalo.js?_v=' + (Math.random() + '') + '"></scr' + 'ipt>');
    </script>
</head>
<body>
<div class="container mt-3 mb-5">
    <h1>LibHaLo Demo</h1>
    <h2>Unlock key slot</h2>

    <div class="mb-4">
        <strong>Number of key slot to use:</strong>
        <input type="text" class="form-control" id="keyNo" id="keyNo" value="1">
    </div>

    <strong>Status text:</strong>
    <pre id="statusText" style="white-space: pre-wrap; word-break: break-all;">Please click the "check if locked" button below.</pre>
    <pre id="statusWaitText" style="white-space: pre-wrap; word-break: break-all; margin-top: 10px;"></pre>

    <div class="mt-2">
        <button class="btn btn-secondary" id="btnCheck" onclick="btnCheckLocked();">
            Check if locked
        </button>
        <button class="btn btn-secondary" id="btnUnlock" onclick="btnUnlock();" disabled>
            Unlock
        </button>
    </div>

    <script type="text/javascript">
        let unlockSig = null;

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }

        function log(text) {
            document.getElementById('statusText').innerText += text + '\n';
        }

        async function waitForToken(jwt, timeToWaitSec) {
            if (timeToWaitSec > 0) {
                document.getElementById('statusWaitText').innerText = 'Wait for ' + timeToWaitSec + ' more seconds...';
                setTimeout(waitForToken, 1000, jwt, timeToWaitSec - 1);
                return;
            }

            const res = await fetch('https://tx.burner.pro/unlock/sign', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({"jwt": jwt}),
            });

            const obj = await res.json();
            unlockSig = obj.sig;
            document.getElementById('btnUnlock').disabled = false;
            document.getElementById('statusText').innerText = 'Click on "Unlock" and scan the tag to unlock your key slot.';
        }

        async function btnCheckLocked() {
            document.getElementById('btnCheck').disabled = true;
            document.getElementById('keyNo').disabled = true;
            let keyNo = document.getElementById('keyNo').value;
            let command = {
                "name": "get_data_struct",
                "spec": "keySlotFailedAuthCtr:" + keyNo + ",keySlotAuthFailState:" + keyNo + ",keySlotAuthUnlockChallenge:" + keyNo
            }

            try {
                document.getElementById('statusText').innerText = '';
                log('Scanning the tag...');
                const res = await execHaloCmdWeb(command);
                document.getElementById('statusText').innerText = '';
                const authCtr = parseInt(res.data["keySlotFailedAuthCtr:" + keyNo]);
                const failState = parseInt(res.data["keySlotAuthFailState:" + keyNo], 16);
                const failLevel = failState & 0x0F;
                const challenge = res.data["keySlotAuthUnlockChallenge:" + keyNo];

                log('Failed auth counter: ' + authCtr);

                switch (failLevel) {
                    case 1:
                        log('Key slot is not restricted.');
                        break;
                    case 2:
                        log('SIG/HW Soft lock. You will be required to unlock the key slot using online/hardware unlocking procedure on subsequent authentication failures.');
                        break;
                    case 3:
                        log('HW Soft lock. You will be required to unlock the key slot using hardware unlocking procedure on subsequent authentication failures.');
                        break;
                    case 4:
                        log('Key slot is permanently locked.');
                        break;
                    default:
                        log('Unknown fail level: ' + failLevel);
                        break;
                }

                if ((failState & 0x10) === 0x10) {
                    log('Key slot is not locked. You may proceed with another authentication attempt.');
                } else if (typeof challenge === "string") {
                    log('');
                    log('Connecting with the server to obtain the unlocking JWT...');
                    // send our challenge to the server
                    // the server will return a JWT that will be valid in the future
                    const res = await fetch('https://tx.burner.pro/unlock/challenge', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({"challenge": challenge}),
                    });
                    const resParsed = await res.json();
                    // parse the JWT to figure out how many seconds do we need to wait
                    // before the JWT becomes valid
                    const jwt = parseJwt(resParsed.jwt);
                    const timeToWaitSec = jwt.nbf - jwt.iat;
                    log('Obtained unlock JWT: ' + resParsed.jwt);
                    log('Time before JWT becomes valid: ' + timeToWaitSec + ' seconds.');
                    log('We need to wait for some time before we will be able to redeem it.');
                    // wait the indicated amount of time and make another request to the server
                    // to redeem the JWT token for the key slot unlocking signature
                    waitForToken(resParsed.jwt, timeToWaitSec);
                }
            } catch (e) {
                // the operation has failed, display the reason to the user
                console.error('execHaloCmdWeb error', e);
                log(e);
            }
        }

        async function btnUnlock() {
            let keyNo = document.getElementById('keyNo').value;
            let command = {
                "name": "unlock_online",
                "keyNo": parseInt(keyNo),
                "unlockSig": unlockSig,
            }

            try {
                log('Scanning the tag to unlock...');
                const res = await execHaloCmdWeb(command);
                log('Status: ' + JSON.stringify(res, null, 4));
                if (res.status === 'ok') {
                    log('Key slot was unlocked succesfully. You may now proceed with another authentication attempt.');
                }
            } catch (e) {
                // the operation has failed, display the reason to the user
                console.error('execHaloCmdWeb error', e);
                log(e);
            }
        }
    </script>
</div>
</body>
</html>

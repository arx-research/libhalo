name: Check build

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'cli/README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'cli/README.md'
      - 'docs/**'
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Install native dependencies (Linux)
        run: |
          sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd pcsc-tools
      - name: Checkout the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Node.JS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Enable corepack
        run: |
          corepack enable
      - name: Install dependencies
        shell: bash
        run: |
          yarn workspaces focus --all
          yarn install --immutable
      # Install scripts are off (.yarnrc.yml); compile the one native module.
      - name: Build pcsclite
        run: |
          yarn build:native
      - name: Run tsc (core)
        run: |
          cd core
          yarn tsc
      - name: Run webpack (core)
        run: |
          cd core
          yarn webpack
      - name: Run tsc (cli)
        run: |
          cd cli
          yarn tsc
      - name: Build halo-tools with webpack
        shell: bash
        run: |
          cd cli
          yarn webpack
          mv dist_webpack/* .
          mkdir build
          cp ../node_modules/@pokusew/pcsclite/build/Release/pcsclite.node build/pcsclite.node
          cp package.json orig-package.json
      - name: Package HaLo CLI tool (Linux)
        shell: bash
        run: |
          cd cli
          node ./build_scripts/ci_scripts.js --platform linux --product cli
          yarn pkg --compress GZip -t node24-linux-x64 -o dist/halocli .
      - name: Test produced binary
        shell: bash
        run: |
          cd cli
          chmod +x dist/halocli
          sudo ./dist/halocli cli_version
